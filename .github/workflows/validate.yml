name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install shellcheck, xmllint, Claude Code CLI
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck libxml2-utils
          npm install -g @anthropic-ai/claude-code
      - name: Run all checks (unit tests, report checker, cards, shellcheck, plugin validate)
        run: tests/run.sh
      - name: Require a version bump when skills/ or agents/ change
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          tests/check_version_bump.sh "$base"
