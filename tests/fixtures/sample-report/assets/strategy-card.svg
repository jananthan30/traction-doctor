  </g>

  <rect x="80" y="676" width="4" height="132" fill="#383835"/>
  <text x="112" y="712" class="crux">The crux: <tspan class="crux-b">Do teams keep deploying with it</tspan></text>
  <text x="112" y="756" class="crux-b">after the first week?</text>
  <text x="112" y="800" class="crux">Retention decides everything below.</text>

  <text x="80" y="886" class="label">BIGNESS BREAKDOWN</text>
  <g>
    <text x="80" y="936" class="row">Why-now force</text>
    <rect x="380" y="926" width="560" height="8" rx="4" fill="#2c2c2a"/>
    <rect x="380" y="926" width="336" height="8" rx="4" fill="#3987e5"/>
    <text x="1120" y="936" class="num" text-anchor="end">3/5</text>

    <text x="80" y="982" class="row">Wedge sharpness</text>
    <rect x="380" y="972" width="560" height="8" rx="4" fill="#2c2c2a"/>
    <rect x="380" y="972" width="336" height="8" rx="4" fill="#3987e5"/>
    <text x="1120" y="982" class="num" text-anchor="end">3/5</text>

    <text x="80" y="1028" class="row">Market headroom</text>
    <rect x="380" y="1018" width="560" height="8" rx="4" fill="#2c2c2a"/>
    <rect x="380" y="1018" width="224" height="8" rx="4" fill="#3987e5"/>
    <text x="1120" y="1028" class="num" text-anchor="end">2/5</text>

    <text x="80" y="1074" class="row">Expansion path</text>
    <rect x="380" y="1064" width="560" height="8" rx="4" fill="#2c2c2a"/>
    <rect x="380" y="1064" width="224" height="8" rx="4" fill="#3987e5"/>
    <text x="1120" y="1074" class="num" text-anchor="end">2/5</text>

    <text x="80" y="1120" class="row">Delivery leverage</text>
    <rect x="380" y="1110" width="560" height="8" rx="4" fill="#2c2c2a"/>
    <rect x="380" y="1110" width="224" height="8" rx="4" fill="#3987e5"/>
    <text x="1120" y="1120" class="num" text-anchor="end">2/5</text>
  </g>

  <g>
    <rect x="80" y="1180" width="510" height="180" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="112" y="1228" class="bh-a">PRIMARY CHANNEL</text>
    <text x="112" y="1266" class="body-b">Homebrew + GitHub listing</text>
    <text x="112" y="1298" class="body">Install command is the funnel</text>
    <text x="112" y="1330" class="body">This week: rewrite the README hero</text>

    <rect x="610" y="1180" width="510" height="180" rx="16" fill="none" stroke="#d03b3b" stroke-opacity="0.45"/>
    <text x="646" y="1228" class="bh-k">KILL CRITERIA</text>
    <text x="646" y="1266" class="body-b">&lt;100 installs/wk by 2026-12-31</text>
    <text x="646" y="1298" class="body">&lt;10% week-4 retention</text>
