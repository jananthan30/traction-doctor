  <line x1="80" y1="1396" x2="1120" y2="1396" stroke="#383835"/>
  <rect x="80" y="1416" width="1040" height="56" rx="10" fill="#0d0d0d" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="102" y="1452" class="mono"><tspan class="mono-d">$</tspan> brew install acme-cli</text>
  <text x="80" y="1510" class="fp">Generated by traction-doctor v0.5.0 · 2026-09-25</text>
  <text x="1120" y="1510" class="fp-b" text-anchor="end">github.com/acme/acme-cli</text>
