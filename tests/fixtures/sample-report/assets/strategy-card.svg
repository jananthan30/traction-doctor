  <rect width="1200" height="1540" fill="#1a1a19"/>

  <text x="80" y="92" class="kicker">STRATEGY REPORT · DEVELOPER TOOLS · CLI</text>
  <text x="80" y="162" class="h1">acme-cli</text>
  <text x="80" y="212" class="sub">Fast local-first deploys for small teams</text>
  <text x="80" y="248" class="sub-b">Scored, red-teamed, falsifiable</text>

  <g>
    <rect x="80" y="300" width="510" height="330" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="116" y="366" class="label">BIGNESS</text>
    <text x="554" y="366" class="conf" text-anchor="end">MEDIUM CONFIDENCE</text>
    <text x="116" y="466" class="hero">12<tspan class="hero-d">/25</tspan></text>
    <text x="116" y="512" class="band">Niche tool / lifestyle business</text>
    <rect x="116" y="540" width="430" height="10" rx="5" fill="#2c2c2a"/>
    <rect x="116" y="540" width="206" height="10" rx="5" fill="#3987e5"/>
    <text x="116" y="590" class="note">Real pain, crowded field, thin expansion</text>

    <rect x="610" y="300" width="510" height="330" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="646" y="366" class="label">MOAT TODAY</text>
    <text x="646" y="466" class="hero">2<tspan class="hero-d">/25</tspan></text>
    <text x="646" y="512" class="band">Nothing defensible yet</text>
